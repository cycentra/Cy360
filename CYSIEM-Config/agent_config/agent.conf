<!--
  CyCentra 360 — Wazuh Agent Configuration
  Deployed to: /var/ossec/etc/shared/default/agent.conf
  Managed by:  cycentra-setup.sh (Step 18) and scripts/deploy_agent_config.sh
-->

<agent_config os="Windows">
  <localfile>
    <location>Security</location>
    <log_format>eventchannel</log_format>
    <query>
      <QueryList>
        <Query Id="0" Path="Security">
          <Select Path="Security">*</Select>
          <Suppress Path="Security">
            *[System[(EventID=5156 or EventID=5157 or EventID=5447 or EventID=4658)]]
          </Suppress>
        </Query>
      </QueryList>
    </query>
  </localfile>
</agent_config>

<agent_config os="Linux">
  <localfile>
    <location>journald</location>
    <log_format>journald</log_format>
    <filter field="PRIORITY">0,1,2,3,4</filter>
  </localfile>
</agent_config>

<agent_config os="Darwin">
  <localfile>
    <location>apple-oslog</location>
    <log_format>apple-oslog</log_format>
    <query>
      (subsystem == "com.apple.Authentication" or subsystem == "com.apple.securityd")
      and (type == "error" or type == "fault")
    </query>
  </localfile>
</agent_config>

<agent_config>
  <client>
    <remote_conf>
      <events_per_second>100</events_per_second>
    </remote_conf>
  </client>
</agent_config>
