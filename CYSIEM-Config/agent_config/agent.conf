<!--
  CyCentra 360 — Wazuh Agent Configuration
  Deployed to: /var/ossec/etc/shared/default/agent.conf
  Managed by:  cycentra-setup.sh (Step 18) and scripts/deploy_agent_config.sh
-->

<agent_config os="Windows">
  <!-- Windows Security event log: auth, account mgmt, privilege use, process creation -->
  <localfile>
    <location>Security</location>
    <log_format>eventchannel</log_format>
    <query>
      <QueryList>
        <Query Id="0" Path="Security">
          <Select Path="Security">*</Select>
          <Suppress Path="Security">
            *[System[(EventID=5156 or EventID=5157 or EventID=5447 or EventID=4658)]]
          </Suppress>
        </Query>
      </QueryList>
    </query>
  </localfile>

  <!-- Windows System log: required for EventID 7036 (service start/stop)
       Rule 101010 fires when Wazuh agent service is stopped — anti-tamper coverage. -->
  <localfile>
    <location>System</location>
    <log_format>eventchannel</log_format>
    <query>
      <QueryList>
        <Query Id="0" Path="System">
          <!-- Service state changes (7036) + driver load failures (7045) -->
          <Select Path="System">
            *[System[(EventID=7036 or EventID=7045 or EventID=7040)]]
          </Select>
        </Query>
      </QueryList>
    </query>
  </localfile>

  <!-- Sysmon: process creation, network, driver, registry, file, injection, tamper
       Requires Sysmon64 installed + cycentra_sysmon_config.xml applied.
       Deploy script: /opt/cycentra/sysmon/deploy_sysmon.ps1 -->
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- PowerShell Script Block Logging: captures encoded/obfuscated script content
       Enables rules 100300-100302 (PowerShell/macro LOLBin detection). -->
  <localfile>
    <location>Microsoft-Windows-PowerShell/Operational</location>
    <log_format>eventchannel</log_format>
    <query>
      <QueryList>
        <Query Id="0" Path="Microsoft-Windows-PowerShell/Operational">
          <Select Path="Microsoft-Windows-PowerShell/Operational">
            *[System[(EventID=4103 or EventID=4104 or EventID=4105 or EventID=4106)]]
          </Select>
        </Query>
      </QueryList>
    </query>
  </localfile>
</agent_config>

<agent_config os="Linux">
  <localfile>
    <location>journald</location>
    <log_format>journald</log_format>
    <filter field="PRIORITY">0,1,2,3,4</filter>
  </localfile>
</agent_config>

<agent_config os="Darwin">
  <!-- macOS Unified Log: auth failures, TCC privacy decisions, kext events,
       ES framework denials. Expanded to catch: Gatekeeper, XPC policy,
       endpoint-security (for rule 101020 — agent file tamper detection). -->
  <localfile>
    <location>apple-oslog</location>
    <log_format>apple-oslog</log_format>
    <query>
      (
        subsystem == "com.apple.Authentication"
        or subsystem == "com.apple.securityd"
        or subsystem == "com.apple.MobileKeyBag"
        or subsystem == "com.apple.security.sos"
        or subsystem == "com.apple.XPC"
        or subsystem == "com.apple.security"
        or subsystem == "com.apple.privacy.access"
        or subsystem == "com.apple.Gatekeeper"
        or subsystem == "com.apple.kext"
        or subsystem == "com.apple.libsystem.info"
      )
      and (type == "error" or type == "fault" or type == "default")
    </query>
  </localfile>
</agent_config>

<agent_config>
  <client>
    <remote_conf>
      <events_per_second>100</events_per_second>
    </remote_conf>
  </client>
</agent_config>

<!-- CyCentra 360: Resource utilization monitoring — runs every 5 minutes -->
<agent_config os="Linux">
  <localfile>
    <log_format>full_command</log_format>
    <command>bash /var/ossec/etc/shared/cy360_resource_check.sh</command>
    <alias>cy360-resource-check</alias>
    <frequency>300</frequency>
  </localfile>
</agent_config>

<agent_config os="Darwin">
  <localfile>
    <log_format>full_command</log_format>
    <command>bash /Library/Ossec/etc/shared/cy360_resource_check.sh</command>
    <alias>cy360-resource-check</alias>
    <frequency>300</frequency>
  </localfile>
</agent_config>

<agent_config os="Windows">
  <localfile>
    <log_format>full_command</log_format>
    <command>PowerShell.exe -ExecutionPolicy Bypass -NonInteractive -File "C:\Program Files (x86)\ossec-agent\shared\cy360_resource_check.ps1"</command>
    <alias>cy360-resource-check</alias>
    <frequency>300</frequency>
  </localfile>
</agent_config>
