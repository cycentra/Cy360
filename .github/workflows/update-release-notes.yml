name: "AI Release Notes Automation (Custom AI)"

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches:
      - main

jobs:

  summarize_pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Install gh CLI
        run: sudo apt-get install gh jq -y

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get PR diff
        id: prdiff
        run: |
          gh pr diff ${{ github.event.pull_request.number }} > pr.diff

      - name: Send diff to cyq.cycentra.com AI Summarizer
        id: summarize
        env:
          CYQ_TOKEN: ${{ secrets.CYQ_API_TOKEN }}
        run: |
          DIFF=$(cat pr.diff | jq -Rs .)
          TITLE=$(echo "${{ github.event.pull_request.title }}" | jq -Rs .)
          BODY="{\"diff\": $DIFF, \"pr_title\": $TITLE}"
          SUMMARY_RESPONSE=$(curl -s -X POST "https://cyq.cycentra.com/summarize" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $CYQ_TOKEN" \
            -d "$BODY")
          SUMMARY=$(echo "$SUMMARY_RESPONSE" | jq -r .summary)
          echo "$SUMMARY" > summary.txt
          echo "summary<<EOF" >> $GITHUB_ENV
          echo "$SUMMARY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Post summary as a PR comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "### Diff Summary (AI)\n\n$(cat summary.txt)"

  update_release_notes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Install jq and gh CLI
        run: sudo apt-get install gh jq -y

      - name: Checkout code
        uses: actions/checkout@v4

      # Identify latest merged PR for this push
      - name: Get latest merged PR number
        id: pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_JSON=$(gh pr list --state merged --base main --limit 10 --json number,mergeCommit)
          # Find the PR whose mergeCommit matches this push, else fallback to most recent merged PR
          PR_NUM=$(echo "$PR_JSON" | jq ".[] | select(.mergeCommit==\"$GITHUB_SHA\") | .number" | head -1)
          if [ -z "$PR_NUM" ]; then PR_NUM=$(echo "$PR_JSON" | jq ".[0].number"); fi
          echo "number=$PR_NUM" >> $GITHUB_OUTPUT

      # Fetch the AI summary comment from the PR, searching for the marker "### Diff Summary"
      - name: Get PR summary comment
        id: prcomment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM=${{ steps.pr.outputs.number }}
          SUMMARY=$(gh pr view "$PR_NUM" --json comments --jq '.comments[] | select(.body | startswith("### Diff Summary (AI)")) | .body' | head -1)
          if [ -z "$SUMMARY" ]; then SUMMARY="*No AI summary found for this PR.*"; fi
          echo "summary<<EOF" >> $GITHUB_ENV
          echo "$SUMMARY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      # Get latest version tag (default to v0.0.0)
      - name: Get latest version tag
        id: tagfetch
        run: |
          tag=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          if [ -z "$tag" ]; then tag="v0.0.0"; fi
          echo "tag=$tag" >> $GITHUB_OUTPUT

      # Bump patch version
      - name: Bump patch version
        id: bumpver
        run: |
          oldtag="${{ steps.tagfetch.outputs.tag }}"
          IFS='.' read -r major minor patch <<<"${oldtag#v}"
          patch=$((patch+1))
          newtag="v$major.$minor.$patch"
          echo "new_version=$newtag" >> $GITHUB_OUTPUT

      # Update RELEASE_NOTES.md
      - name: Update RELEASE_NOTES.md
        run: |
          { echo "## ${{ steps.bumpver.outputs.new_version }} – $(date +'%Y-%m-%d')"
            echo ""
            echo "${{ env.summary }}"
            echo ""
            cat RELEASE_NOTES.md 2>/dev/null || true;
          } > RELEASE_NOTES.tmp
          mv RELEASE_NOTES.tmp RELEASE_NOTES.md

      # Commit, tag, and push changes
      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push release notes and tag
        run: |
          git add RELEASE_NOTES.md
          git commit -m "docs: update release notes for ${{ steps.bumpver.outputs.new_version }}" || echo "No changes to commit"
          git tag ${{ steps.bumpver.outputs.new_version }}
          git push origin main --tags
