name: "AI Release Notes Automation (Custom AI)\n\non:\n  pull_request:\n    types: [opened, synchronize]\n  push:\n    branches:\n      - main\n\npermissions:\n  pull-requests: write\n  contents: write\n\njobs:\n\n  summarize_pr:\n    env:\n      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}\n    if: github.event_name == 'pull_request'\n    runs-on: ubuntu-latest\n    steps:\n      - name: Install gh CLI\n        run: sudo apt-get install gh jq -y\n\n      - name: Checkout code\n        uses: actions/checkout@v4\n\n      - name: Get PR diff\n        id: prdiff\n        run: |\n          gh pr diff ${{ github.event.pull_request.number }} > pr.diff\n\n      - name: Send diff to cyq.cycentra.com AI Summarizer\n        id: summarize\n        env:\n          CYQ_TOKEN: ${{ secrets.CYQ_API_TOKEN }}\n        run: |\n          DIFF=$(cat pr.diff | jq -Rs .)\n          TITLE=$(echo "${{ github.event.pull_request.title }}" | jq -Rs .)\n          BODY="{\"diff\": $DIFF, \"pr_title\": $TITLE}"\n          SUMMARY_RESPONSE=$(curl -s -X POST "https://cyq.cycentra.com/api/v1/chat" \n            -H "Content-Type: application/json" \n            -H "Authorization: Bearer $CYQ_TOKEN" \n            -d "$BODY")\n          SUMMARY=$(echo "$SUMMARY_RESPONSE" | jq -r .summary)\n          echo "$SUMMARY" > summary.txt\n          echo "summary<<EOF" >> $GITHUB_ENV\n          echo "$SUMMARY" >> $GITHUB_ENV\n          echo "EOF" >> $GITHUB_ENV\n\n      - name: Post summary as a PR comment\n        env:\n          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}\n        run: |\n          gh pr comment ${{ github.event.pull_request.number }} --body "### Diff Summary (AI)\n\n$(cat summary.txt)"\n\n  update_release_notes:\n    if: github.event_name == 'push' && github.ref == 'refs/heads/main'\n    runs-on: ubuntu-latest\n    steps:\n      - name: Install jq and gh CLI\n        run: sudo apt-get install gh jq -y\n\n      - name: Checkout code\n        uses: actions/checkout@v4\n\n      # Identify latest merged PR for this push\n      - name: Get latest merged PR number\n        id: pr\n        env:\n          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}\n        run: |\n          PR_JSON=$(gh pr list --state merged --base main --limit 10 --json number,mergeCommit)\n          # Find the PR whose mergeCommit matches this push, else fallback to most recent merged PR\n          PR_NUM=$(echo "$PR_JSON" | jq ".[] | select(.mergeCommit==\"$GITHUB_SHA\") | .number" | head -1)\n          if [ -z "$PR_NUM" ]; then PR_NUM=$(echo "$PR_JSON" | jq ".[0].number"); fi\n          echo "number=$PR_NUM" >> $GITHUB_OUTPUT\n\n      # Fetch the AI summary comment from the PR, searching for the marker "### Diff Summary"\n      - name: Get PR summary comment\n        id: prcomment\n        env:\n          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}\n        run: |\n          PR_NUM=${{ steps.pr.outputs.number }}\n          SUMMARY=$(gh pr view "$PR_NUM" --json comments --jq '.comments[] | select(.body | startswith("### Diff Summary (AI)")) | .body' | head -1)\n          if [ -z "$SUMMARY" ]; then SUMMARY="*No AI summary found for this PR.*"; fi\n          echo "summary<<EOF" >> $GITHUB_ENV\n          echo "$SUMMARY" >> $GITHUB_ENV\n          echo "EOF" >> $GITHUB_ENV\n\n      # Get latest version tag (default to v0.0.0)\n      - name: Get latest version tag\n        id: tagfetch\n        run: |\n          tag=$(git tag --list 'v*' --sort=-v:refname | head -n 1)\n          if [ -z "$tag" ]; then tag="v0.0.0"; fi\n          echo "tag=$tag" >> $GITHUB_OUTPUT\n\n      # Bump patch version\n      - name: Bump patch version\n        id: bumpver\n        run: |\n          oldtag="${{ steps.tagfetch.outputs.tag }}"\n          IFS='.' read -r major minor patch <<<"${oldtag#v}"\n          patch=$((patch+1))\n          newtag="v$major.$minor.$patch"\n          echo "new_version=$newtag" >> $GITHUB_OUTPUT\n\n      # Update RELEASE_NOTES.md\n      - name: Update RELEASE_NOTES.md\n        run: |\n          { echo "## ${{ steps.bumpver.outputs.new_version }} – $(date +'%%Y-%%m-%%d')"\n            echo ""\n            echo "${{ env.summary }}"\n            echo ""\n            cat RELEASE_NOTES.md 2>/dev/null || true;\n          } > RELEASE_NOTES.tmp\n          mv RELEASE_NOTES.tmp RELEASE_NOTES.md\n\n      # Commit, tag, and push changes\n      - name: Configure git\n        run: |\n          git config --global user.name "github-actions[bot]"\n          git config --global user.email "github-actions[bot]@users.noreply.github.com"\n\n      - name: Commit and push release notes and tag\n        run: |\n          git add RELEASE_NOTES.md\n          git commit -m "docs: update release notes for ${{ steps.bumpver.outputs.new_version }}" || echo "No changes to commit"\n          git tag ${{ steps.bumpver.outputs.new_version }}\n          git push origin main --tags\n