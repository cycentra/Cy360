name: Agent — Auto-label PR with auto-merge

# Fires when any PR targeting main is opened.
# If the PR was created by a Copilot coding agent (copilot[bot]) it
# automatically receives the `auto-merge` label so the full automation
# chain fires without any human step:
#
#   Agent finishes work → opens PR → THIS workflow fires → adds auto-merge label
#   → agent-auto-merge.yml fires → merges PR → agent-release.yml → deploy.yml

on:
  pull_request:
    types: [opened]
    branches: [main]

jobs:
  label-agent-pr:
    # Only run for PRs opened by the Copilot coding agent bot
    if: github.event.pull_request.user.login == 'copilot[bot]'

    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Add auto-merge label
        uses: actions/github-script@v7
        with:
          script: |
            const prNum  = context.payload.pull_request.number;
            const author = context.payload.pull_request.user.login;
            console.log(`PR #${prNum} opened by ${author} — adding auto-merge label`);

            await github.rest.issues.addLabels({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: prNum,
              labels:       ['auto-merge'],
            });

            console.log(`✅ auto-merge label added to PR #${prNum}`);
