name: Agent Release — Auto-Tag and Publish

# Fires when a PR with tests:passed label is merged to main.
# Three supported triggers:
#   1. pull_request: closed  — when a PR is closed/merged via the GitHub UI
#   2. push: branches: [main] — when a PR merge creates a push event on main
#   3. workflow_dispatch     — called by agent-auto-merge.yml after merging via API
#                            — or run manually with bypass_tests_gate=true to skip
#                              the tests:passed label requirement (emergency use only)
#
# Steps:
#   1. Reads next version from RELEASE_NOTES.md  (## v1.0.NNN)
#   2. Validates the entry exists and has a category heading + description
#   3. Stamps _WIZARD_VERSION_ in cycentra-setup.sh
#   4. Updates backend/pyproject.toml version
#   5. Commits the stamped files
#   6. Creates annotated tag vX.X.X with RELEASE_NOTES content as annotation
#   7. Pushes commit + tag
#   8. Triggers deploy.yml via workflow_dispatch (explicit, bypasses GITHUB_TOKEN
#      restriction where tag pushes from workflows do not fire further workflows)

on:
  pull_request:
    types: [closed]
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to release (must have tests:passed label, unless bypass_tests_gate is set)'
        required: false
      bypass_tests_gate:
        description: 'Skip the tests:passed label check — use only when CI tests are broken and release is urgent'
        type: boolean
        default: false
        required: false

jobs:
  auto-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      # ── Step 0: Determine whether this run should produce a release ───────────
      - name: Check release conditions
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EVENT="${{ github.event_name }}"
          SHOULD="false"
          PR_NUM=""

          if [[ "$EVENT" == "pull_request" ]]; then
            MERGED="${{ github.event.pull_request.merged }}"
            LABELS='${{ toJson(github.event.pull_request.labels.*.name) }}'
            PR_NUM="${{ github.event.pull_request.number }}"
            if [[ "$MERGED" == "true" ]] && echo "$LABELS" | grep -q '"tests:passed"'; then
              SHOULD="true"
            else
              echo "pull_request event: merged=$MERGED, labels=$LABELS — skipping"
            fi

          elif [[ "$EVENT" == "push" ]]; then
            # Extract PR number from the merge commit message ("Merge pull request #N")
            COMMIT_MSG="${{ github.event.head_commit.message }}"
            PR_NUM=$(echo "$COMMIT_MSG" | grep -oE 'pull request #[0-9]+' | grep -oE '[0-9]+' || true)
            if [[ -z "$PR_NUM" ]]; then
              echo "push event: no PR merge commit detected — skipping"
            else
              LABELS=$(curl -sf \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${{ github.repository }}/issues/${PR_NUM}/labels" \
                | jq -r '.[].name' 2>/dev/null || true)
              if echo "$LABELS" | grep -q "^tests:passed$"; then
                SHOULD="true"
              else
                echo "push event: PR #$PR_NUM labels: $(echo $LABELS | tr '\n' ',') — tests:passed not set, skipping"
              fi
            fi

          elif [[ "$EVENT" == "workflow_dispatch" ]]; then
            BYPASS="${{ github.event.inputs.bypass_tests_gate }}"
            PR_NUM="${{ github.event.inputs.pr_number }}"

            if [[ "$BYPASS" == "true" ]]; then
              echo "⚠️  bypass_tests_gate=true — skipping tests:passed label check (emergency release)"
              SHOULD="true"
            elif [[ -n "$PR_NUM" ]]; then
              LABELS=$(curl -sf \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${{ github.repository }}/issues/${PR_NUM}/labels" \
                | jq -r '.[].name' 2>/dev/null || true)
              if echo "$LABELS" | grep -q "^tests:passed$"; then
                SHOULD="true"
              else
                echo "workflow_dispatch: PR #$PR_NUM labels: $(echo $LABELS | tr '\n' ',') — tests:passed not set, skipping"
              fi
            else
              echo "workflow_dispatch: no pr_number and bypass_tests_gate not set — skipping"
            fi
          fi

          echo "should_release=$SHOULD" >> $GITHUB_OUTPUT
          echo "pr_number=$PR_NUM"      >> $GITHUB_OUTPUT
          echo "Release gate: should_release=$SHOULD  pr_number=$PR_NUM"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.should_release == 'true'
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.should_release == 'true'
        with:
          python-version: '3.12'

      - name: Configure git identity
        if: steps.gate.outputs.should_release == 'true'
        run: |
          git config user.name  "cyra-devops[bot]"
          git config user.email "cyra-devops@users.noreply.github.com"

      # ── Step 1: Read latest version from RELEASE_NOTES.md ────────────────────
      - name: Read version from RELEASE_NOTES.md
        if: steps.gate.outputs.should_release == 'true'
        id: version
        run: |
          python3 - << 'PYEOF'
          import re, os, sys

          with open("RELEASE_NOTES.md") as f:
              content = f.read()

          versions = re.findall(r"^## (v[\d.]+)", content, re.MULTILINE)
          if not versions:
              print("ERROR: No version entries found in RELEASE_NOTES.md")
              sys.exit(1)

          latest = versions[0]
          print(f"Latest version in RELEASE_NOTES.md: {latest}")

          out = os.environ.get("GITHUB_OUTPUT", "")
          if out:
              with open(out, "a") as f:
                  f.write(f"version={latest}\n")
                  f.write(f"version_num={latest.lstrip('v')}\n")
          PYEOF

      # ── Step 2: Validate RELEASE_NOTES entry ─────────────────────────────────
      - name: Validate RELEASE_NOTES entry
        if: steps.gate.outputs.should_release == 'true'
        run: |
          python3 - << PYEOF
          import re, sys

          version = "${{ steps.version.outputs.version }}"
          with open("RELEASE_NOTES.md") as f:
              content = f.read()

          pattern = rf"^## {re.escape(version)}.*?(?=^## v|\Z)"
          match = re.search(pattern, content, re.MULTILINE | re.DOTALL)
          if not match:
              print(f"ERROR: No RELEASE_NOTES entry found for {version}")
              sys.exit(1)

          block = match.group(0).strip()
          headings = [
              "### Bug Fix", "### Fix",
              "### Feature", "### Features",
              "### Enhancement", "### Enhancements",
              "### Chore", "### Hotfix", "### Refactor",
              "### Performance", "### Security",
              "### Bug Fixes",
          ]
          if not any(h in block for h in headings):
              print(f"ERROR: Entry for {version} has no category heading (### Bug Fixes, etc.)")
              sys.exit(1)

          if len([l for l in block.splitlines() if l.strip()]) < 3:
              print(f"ERROR: Entry for {version} is too short — add description")
              sys.exit(1)

          print(f"RELEASE_NOTES entry for {version} is valid")
          print(block[:400])
          PYEOF

      # ── Step 3: Check tag does not already exist ──────────────────────────────
      - name: Check tag availability
        if: steps.gate.outputs.should_release == 'true'
        id: tagcheck
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if git tag -l | grep -q "^${VERSION}$"; then
            echo "Tag $VERSION already exists — skipping to prevent duplicate release"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Tag $VERSION is available"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      # ── Step 4: Stamp _WIZARD_VERSION_ in cycentra-setup.sh ──────────────────
      # This is what git-push.sh used to do manually
      - name: Stamp version in cycentra-setup.sh
        if: steps.tagcheck.outputs.skip != 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TIMESTAMP=$(date -u "+%Y-%m-%d %H:%M UTC")
          STAMP="${VERSION} — ${TIMESTAMP}"

          if [ -f "cycentra-setup.sh" ]; then
            # Replace placeholder (fresh checkout) OR existing stamped version (update)
            sed -i "s|_WIZARD_VERSION_|${STAMP}|g" cycentra-setup.sh
            sed -i "s|Setup & Update Wizard v[0-9]\+\.[0-9]\+\.[0-9]\+ — [0-9-]* [0-9:]* UTC|Setup & Update Wizard ${STAMP}|g" cycentra-setup.sh
            # Also update the _SCRIPT_VERSION variable if present
            sed -i "s|^_SCRIPT_VERSION=.*|_SCRIPT_VERSION=\"${VERSION}\"|" cycentra-setup.sh
            echo "Stamped cycentra-setup.sh: ${STAMP}"
          else
            echo "cycentra-setup.sh not found at repo root — skipping stamp"
          fi

      # ── Step 5: Update pyproject.toml version ────────────────────────────────
      - name: Update pyproject.toml
        if: steps.tagcheck.outputs.skip != 'true'
        run: |
          VER="${{ steps.version.outputs.version_num }}"
          if [ -f "backend/pyproject.toml" ]; then
            sed -i "s/^version = .*/version = \"${VER}\"/" backend/pyproject.toml
            echo "Stamped backend/pyproject.toml: ${VER}"
          fi

      # ── Step 6: Commit stamped files ─────────────────────────────────────────
      - name: Commit version stamps
        if: steps.tagcheck.outputs.skip != 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git add cycentra-setup.sh backend/pyproject.toml 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No stamp changes to commit (placeholders may already be replaced)"
          else
            git commit -m "chore: stamp version ${VERSION} [skip ci]"
            echo "Committed version stamps for ${VERSION}"
          fi

      # ── Step 7: Create annotated tag with RELEASE_NOTES content ──────────────
      - name: Create annotated tag
        if: steps.tagcheck.outputs.skip != 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          TAG_MSG=$(python3 - << PYEOF
          import re
          version = "$VERSION"
          with open("RELEASE_NOTES.md") as f:
              content = f.read()
          pattern = rf"^## {re.escape(version)}.*?(?=^## v|\Z)"
          match = re.search(pattern, content, re.MULTILINE | re.DOTALL)
          print(match.group(0).strip() if match else f"Release {version}")
          PYEOF
          )

          echo "Creating annotated tag: $VERSION"
          git tag -a "$VERSION" -m "$TAG_MSG"
          echo "Tag created"

      # ── Step 8: Push commit + tag ─────────────────────────────────────────────
      # Note: pushes via GITHUB_TOKEN do not trigger downstream workflow runs.
      # deploy.yml is triggered explicitly in Step 9 via workflow_dispatch instead.
      - name: Push to main and push tag
        if: steps.tagcheck.outputs.skip != 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git push origin main
          git push origin "$VERSION"
          echo "✅ Pushed commit and tag $VERSION"

      # ── Step 9: Explicitly trigger deploy.yml ─────────────────────────────────
      # GITHUB_TOKEN pushes do not trigger other workflows, so we fire deploy.yml
      # via workflow_dispatch to guarantee the build-and-publish job runs.
      - name: Trigger deploy.yml via workflow_dispatch
        if: steps.tagcheck.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.version.outputs.version }}';
            console.log(`Dispatching deploy.yml for tag ${version}`);
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: version,
            });
            console.log('✅ deploy.yml dispatched');

      # ── Step 10: Post summary on the merged PR ────────────────────────────────
      - name: Post release summary comment
        if: steps.tagcheck.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const version  = '${{ steps.version.outputs.version }}';
            const runUrl   = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const relUrl   = `${{ github.server_url }}/${{ github.repository }}/releases`;
            const prNum    = '${{ steps.gate.outputs.pr_number }}';

            if (!prNum) {
              console.log('No PR number available — skipping comment');
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: parseInt(prNum),
              body: `## 🚀 cyra-devops — Auto-Release Triggered

**Version:** \`${version}\`

What happened automatically after tests passed and PR merged:
1. ✅ Read \`${version}\` from \`RELEASE_NOTES.md\`
2. ✅ Stamped \`_WIZARD_VERSION_\` in \`cycentra-setup.sh\` with \`${version}\`
3. ✅ Updated \`backend/pyproject.toml\` version
4. ✅ Created annotated git tag \`${version}\` with RELEASE_NOTES content as annotation
5. ✅ Pushed tag + triggered \`deploy.yml\` via workflow_dispatch

**Next:** [Watch build](${runUrl}) → [Releases page](${relUrl})

When \`deploy.yml\` completes, \`RELEASE_NOTES.md\` will be bundled into \`cycentra-release.tar.gz\`, copied to \`/opt/cycentra/RELEASE_NOTES.md\` on servers after \`--update\`, and the System Settings page will show the last 5 entries as before.`,
            });
