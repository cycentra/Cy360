name: Update Agent Command Files

on:
  push:
    branches: [main]
    paths-ignore:
      - '.claude/commands/**'   # prevent infinite loop from our own commits
      - 'docs/WEEKLY_REVIEW.md'

concurrency:
  group: update-agent-commands
  cancel-in-progress: true

jobs:
  update-commands:
    if: "!startsWith(github.event.head_commit.message, 'Release v')"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # need parent commit for diff

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install anthropic --quiet

      - name: Detect changed files
        id: diff
        run: |
          git diff HEAD~1 HEAD --name-only > /tmp/changed_files.txt
          echo "Changed files:"
          cat /tmp/changed_files.txt

      - name: Update agent command files
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 scripts/update_agent_commands.py \
            --changed /tmp/changed_files.txt \
            --commands .claude/commands \
            --repo Cy360

      - name: Commit updated command files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .claude/commands/
          if git diff --staged --quiet; then
            echo "No command files changed — skipping commit"
          else
            git commit -m "chore(agents): auto-sync command files with code changes [skip ci]"
            git push
          fi
