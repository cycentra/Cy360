name: Build & Publish — CyCentra 360

on:
  push:
    tags: ['v*.*.*']
  push:
    branches: [main]
  workflow_dispatch:

jobs:

  # ── Job 1: Build React SPA ──────────────────────────────────────────────────
  build-portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build React SPA
        run: cd portal && npm ci && npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: portal-dist
          path: portal/dist/
          retention-days: 1

  # ── Job 2: Build Python wheels ──────────────────────────────────────────────
  build-wheels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tool
        run: pip install build==1.2.1 -q

      - name: Build cycentra-backend wheel
        run: |
          cd backend
          python -m build --wheel --outdir ../dist/
          echo "Backend wheel: $(ls ../dist/cycentra_backend*.whl)"

      - name: Build cysiemstack-engine wheel
        run: |
          cd backend/cysiemstack/correlation-engine
          python -m build --wheel --outdir ../../../dist/
          echo "Engine wheel: $(ls ../../../dist/cysiemstack*.whl)"

      - uses: actions/upload-artifact@v4
        with:
          name: python-wheels
          path: dist/*.whl
          retention-days: 1

  # ── Job 3: Publish ──────────────────────────────────────────────────────────
  publish:
    needs: [build-portal, build-wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: portal-dist
          path: portal/dist/

      - uses: actions/download-artifact@v4
        with:
          name: python-wheels
          path: dist/

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tag=${TAG}"       >> $GITHUB_OUTPUT
            echo "ver=${TAG#v}"     >> $GITHUB_OUTPUT
            echo "is_release=true"  >> $GITHUB_OUTPUT
          else
            echo "tag=dev-${{ github.run_number }}" >> $GITHUB_OUTPUT
            echo "ver=0.0.${{ github.run_number }}"  >> $GITHUB_OUTPUT
            echo "is_release=false"                  >> $GITHUB_OUTPUT
          fi

      - name: Publish wheels to Cloudsmith
        if: steps.version.outputs.is_release == 'true'
        run: |
          pip install cloudsmith-cli -q
          for wheel in dist/*.whl; do
            echo "Pushing $wheel ..."
            cloudsmith push python cycentra/cycentra360 "$wheel" \
              --api-key "${{ secrets.CLOUDSMITH_API_KEY }}"
          done

      # ── The fix: pass the secret as an env var, reference it as $CS_TOKEN ──
      # Never put ${{ secrets.* }} inside a heredoc — the YAML parser sees }}
      # and breaks. Inject via env: at step level instead, then use $CS_TOKEN
      # as a plain shell variable inside the heredoc.
      - name: Build customer release bundle
        env:
          CS_TOKEN: ${{ secrets.CLOUDSMITH_ENTITLEMENT_TOKEN }}
          GIT_SHA:  ${{ github.sha }}
          BUILD_NUM: ${{ github.run_number }}
        run: |
          TAG=${{ steps.version.outputs.tag }}
          VER=${{ steps.version.outputs.ver }}

          mkdir -p \
            cycentra-release/portal \
            cycentra-release/db/migrations \
            cycentra-release/CYSIEM-Config \
            cycentra-release/scripts \
            cycentra-release/assets

          # Portal: built SPA only — no .jsx source
          cp -r portal/dist/ cycentra-release/portal/dist/

          # DB schema SQL
          [[ -f backend/cysiemstack/postgres/init.sql ]] && \
            cp backend/cysiemstack/postgres/init.sql cycentra-release/db/
          [[ -d backend/cysiemstack/postgres/migrations ]] && \
            cp -r backend/cysiemstack/postgres/migrations/. \
                  cycentra-release/db/migrations/

          # Wazuh config
          [[ -d CYSIEM-Config ]] && \
            cp -r CYSIEM-Config/. cycentra-release/CYSIEM-Config/ || true

          # Branding
          [[ -d scripts ]] && cp -r scripts/. cycentra-release/scripts/ || true
          [[ -d assets  ]] && cp -r assets/.  cycentra-release/assets/  || true

          # Setup wizard
          cp cycentra-setup.sh cycentra-release/
          chmod +x cycentra-release/cycentra-setup.sh

          # VERSION stamp
          echo "${TAG}" > cycentra-release/VERSION

          # manifest.json — uses $CS_TOKEN (shell var), not ${{ secrets.* }}
          # This is the key fix: no GitHub expression syntax inside the heredoc
          INDEX_URL="https://dl.cloudsmith.io/basic/${CS_TOKEN}/cycentra/cycentra360/python/simple/"

          cat > cycentra-release/manifest.json << MANIFEST
{
  "version": "${TAG}",
  "ver_number": "${VER}",
  "commit": "${GIT_SHA}",
  "build_number": "${BUILD_NUM}",
  "packages": {
    "backend": {
      "name": "cycentra-backend",
      "version": "${VER}",
      "index_url": "${INDEX_URL}"
    },
    "engine": {
      "name": "cysiemstack-engine",
      "version": "${VER}",
      "index_url": "${INDEX_URL}"
    }
  }
}
MANIFEST

          # Verify no Python source leaked into bundle
          PY_COUNT=$(find cycentra-release/ -name "*.py" | wc -l)
          echo "Python source files in bundle: ${PY_COUNT}"
          [[ $PY_COUNT -gt 0 ]] && find cycentra-release/ -name "*.py" || true

          # Show bundle layout
          echo "=== Bundle contents ==="
          find cycentra-release/ -type f | sort

          tar -czf cycentra-release.tar.gz cycentra-release/
          ls -lh cycentra-release.tar.gz

      - name: Create GitHub Release
        if: steps.version.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "CyCentra 360 ${{ steps.version.outputs.tag }}"
          draft: false
          prerelease: false
          body: |
            ## CyCentra 360 ${{ steps.version.outputs.tag }}

            **Commit:** `${{ github.sha }}`

            ### Install on a fresh server

                curl -L https://github.com/cycentra/cycentra360/releases/latest/download/cycentra-setup.sh -o cycentra-setup.sh
                sudo bash cycentra-setup.sh

            ### Pin to this specific version

                CYCENTRA_VERSION=${{ steps.version.outputs.tag }} sudo bash cycentra-setup.sh

            ### Update an existing server

                sudo bash cycentra-setup.sh --update

            ---

            **Packages in this release:**
            - `cycentra-backend==${{ steps.version.outputs.ver }}`
            - `cysiemstack-engine==${{ steps.version.outputs.ver }}`
          files: |
            cycentra-release.tar.gz
            cycentra-setup.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}