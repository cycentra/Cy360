name: Build & Publish — CyCentra 360

on:
  push:
    #branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

# Prevents the "5 instances" issue. 
# Only one run per commit (SHA) will execute at a time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── CyEDR agent + system-tray binaries ─────────────────────────────────────
  # Built here on every release so customers only ever need the install link
  # from the Cy360 portal — no separate manual build step. Previously these
  # binaries had to be built by hand on the server (agent-packages/
  # build-edr-packages.sh); build-and-publish now depends on these jobs and
  # bundles their output the same way it already bundles cy360-agent-*.
  # Each job is continue-on-error so a transient build issue on one platform
  # never blocks the whole release — cycentra-setup.sh's staging step (see
  # below) tolerates whichever binaries did make it into the bundle.
  build-edr-linux:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - name: Build CyEDR agent + tray (Linux x86_64, aarch64)
        run: |
          mkdir -p "$(pwd)/edr-out"
          sudo SKIP_WIN=1 SKIP_DEB_RPM=1 \
            DEST_DIR="$(pwd)/edr-out" \
            AGENT_SRC="$(pwd)/agent/cyedr_agent.py" \
            TRAY_SRC="$(pwd)/agent/cyedr_tray.py" \
            bash agent-packages/build-edr-packages.sh 0.0.0 || true
          # build-edr-packages.sh exits 1 on the expected macOS-stub warnings
          # (this job only builds Linux) — verify the binaries we actually
          # need are present rather than trusting the script's exit code.
          test -f edr-out/cyedr-agent-linux-x86_64
          test -f edr-out/cyedr-agent-linux-aarch64
          test -f edr-out/cyedr-tray-linux-x86_64
          test -f edr-out/cyedr-tray-linux-aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: edr-bin-linux
          path: edr-out/*
          retention-days: 5
          if-no-files-found: warn

  build-edr-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13   # Intel — GitHub-hosted, native (no cross-compile)
            arch: intel64
          - runner: macos-14   # Apple Silicon — GitHub-hosted, native
            arch: arm64
    runs-on: ${{ matrix.runner }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build CyEDR agent + tray (macOS ${{ matrix.arch }})
        run: |
          set -e
          mkdir -p out
          python -m pip install --upgrade pip -q
          pip install -q pyinstaller requests psutil paramiko cryptography bcrypt pywinrm xmltodict watchdog
          pyinstaller --onefile --windowed --name cyedr-agent \
            --hidden-import bcrypt --hidden-import paramiko agent/cyedr_agent.py
          cp dist/cyedr-agent "out/cyedr-agent-macos-${{ matrix.arch }}"
          rm -rf build dist

          # rumps is the macOS menu-bar backend cyedr_tray.py uses (run_rumps);
          # launched directly as a raw binary (not a .app bundle) via the
          # LaunchAgent this repo installs, it does not show a Dock icon.
          pip install -q rumps Pillow
          pyinstaller --onefile --windowed --name cyedr-tray agent/cyedr_tray.py
          cp dist/cyedr-tray "out/cyedr-tray-macos-${{ matrix.arch }}"
          chmod +x out/*
      - uses: actions/upload-artifact@v4
        with:
          name: edr-bin-macos-${{ matrix.arch }}
          path: out/*
          retention-days: 5
          if-no-files-found: warn

  build-edr-windows:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build CyEDR agent + tray (Windows x64)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip -q
          pip install -q pyinstaller requests psutil paramiko cryptography bcrypt pywinrm xmltodict watchdog pywin32
          New-Item -ItemType Directory -Force -Path out | Out-Null
          pyinstaller --onefile --noconsole --name cyedr-agent `
            --hidden-import win32evtlog --hidden-import win32evtlogutil --hidden-import win32con `
            --hidden-import win32pipe --hidden-import win32file --hidden-import pywintypes `
            --hidden-import bcrypt agent/cyedr_agent.py
          Copy-Item dist/cyedr-agent.exe out/cyedr-agent-windows-x64.exe
          Remove-Item -Recurse -Force build, dist

          pip install -q pystray Pillow
          pyinstaller --onefile --noconsole --name cyedr-tray `
            --hidden-import win32pipe --hidden-import win32file --hidden-import pywintypes `
            agent/cyedr_tray.py
          Copy-Item dist/cyedr-tray.exe out/cyedr-tray-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: edr-bin-windows
          path: out/*
          retention-days: 5
          if-no-files-found: warn

  build-and-publish:
    needs: [build-edr-linux, build-edr-macos, build-edr-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: write

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tag=${TAG}"       >> $GITHUB_OUTPUT
            echo "ver=${TAG#v}"     >> $GITHUB_OUTPUT
            echo "is_release=true"  >> $GITHUB_OUTPUT
          else
            echo "tag=dev-${{ github.run_number }}" >> $GITHUB_OUTPUT
            echo "ver=0.0.${{ github.run_number }}"  >> $GITHUB_OUTPUT
            echo "is_release=false"                   >> $GITHUB_OUTPUT
          fi

      # ── Build React SPA ─────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build React SPA
        run: cd portal && npm ci && npm run build

      # ── Build Python wheel ───────────────────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Stamp version into pyproject.toml
        run: |
          VER=${{ steps.version.outputs.ver }}
          sed -i "s/^version = .*/version = \"${VER}\"/" backend/pyproject.toml

      - name: Install build tool
        run: pip install build==1.2.1 -q

      - name: Build cycentra-backend wheel
        run: |
          cd backend
          python -m build --wheel --outdir ../dist/

      # ── Compile setup script ─────────────────────────────────────────────
      - name: Install SHC and compile setup script to Linux binary
        run: |
          sudo apt-get install -y shc
          # Compile cycentra-setup.sh → Linux x86_64 binary
          shc -r -f cycentra-setup.sh -o cycentra-setup-bin 2>&1
          strip cycentra-setup-bin 2>/dev/null || true
          chmod +x cycentra-setup-bin
          echo "SHC binary size: $(du -sh cycentra-setup-bin | cut -f1)"
          # NOTE: cycentra-setup.sh (plain script) is kept as-is for the GitHub Release
          # asset — the update mechanism downloads it and the OS reads the #!/bin/bash
          # shebang when the backend executes it directly (no 'bash' prefix needed).
          # The SHC binary (cycentra-setup-bin) is included only in the bundle tarball.

      - name: Download CyEDR agent + tray binaries
        uses: actions/download-artifact@v4
        continue-on-error: true   # a platform build failing must never block the whole release
        with:
          pattern: edr-bin-*
          path: edr-bin
          merge-multiple: true

      - name: Build customer release bundle
        run: |
          TAG=${{ steps.version.outputs.tag }}
          VER=${{ steps.version.outputs.ver }}
          
          mkdir -p cycentra-release/portal
          cp -r portal/dist/ cycentra-release/portal/dist/
          # Ship both the compiled binary and the plain .sh source.
          # The .sh is used by setup.sh's self-update path: when a server runs
          # --update from /opt/cycentra/cycentra-setup.sh the self-copy no-ops
          # ($0 == dest), but the bundle-preference branch copies cycentra-setup.sh
          # from $BUNDLE_DIR on the very first run — fixing stale installs.
          cp cycentra-setup-bin cycentra-release/cycentra-setup
          cp cycentra-setup.sh  cycentra-release/cycentra-setup.sh
          chmod +x cycentra-release/cycentra-setup
          cp docs/RELEASE_NOTES.md cycentra-release/
          echo "${TAG}" > cycentra-release/VERSION

          # Include wheel in bundle so local installs don't need a separate download
          cp dist/*.whl cycentra-release/ 2>/dev/null || true

          # Include Wazuh config assets (rules, decoders, ossec.conf, agent.conf, integrations)
          [[ -d CYSIEM-Config ]] && cp -r CYSIEM-Config cycentra-release/CYSIEM-Config || true

          # Include OOB RBAC default (local cyadmin account)
          [[ -f backend/rbac.default.json ]] && cp backend/rbac.default.json cycentra-release/rbac.default.json || true

          # Include CyEDR agent source + installer scripts so setup.sh can stage them
          # to /var/lib/cycentra-agent-packages/edr/ on every install/update run.
          mkdir -p cycentra-release/agent
          cp agent/cyedr_agent.py cycentra-release/agent/
          cp agent/cyedr_tray.py  cycentra-release/agent/
          mkdir -p cycentra-release/scripts
          cp scripts/cyedr-install.sh  cycentra-release/scripts/
          cp scripts/cyedr-install.ps1 cycentra-release/scripts/

          # Include agent packages so servers never depend on packages.wazuh.com being reachable.
          # setup.sh copies these to /var/lib/cycentra-agent-packages/ during install/update.
          if [[ -d agent-packages ]]; then
            mkdir -p cycentra-release/agent-packages
            cp agent-packages/cy360-agent-* cycentra-release/agent-packages/ 2>/dev/null || true
            echo "Agent packages bundled: $(ls cycentra-release/agent-packages/ | wc -l | tr -d ' ') files"
          fi

          # Include the CyEDR agent + tray binaries built by build-edr-linux/macos/windows
          # above (edr-bin/ from the download-artifact step). setup.sh stages these into
          # /var/lib/cycentra-agent-packages/edr/ automatically — this is what makes the
          # portal's install-link/copy-paste flow work with no manual build step for
          # customers or for devops on every release.
          if [[ -d edr-bin ]] && [[ -n "$(ls -A edr-bin 2>/dev/null)" ]]; then
            mkdir -p cycentra-release/agent-packages/edr
            cp edr-bin/* cycentra-release/agent-packages/edr/ 2>/dev/null || true
            echo "CyEDR binaries bundled: $(ls cycentra-release/agent-packages/edr/ | wc -l | tr -d ' ') files"
          else
            echo "::warning::No CyEDR agent/tray binaries downloaded — one or more build-edr-* jobs failed. Endpoints will fall back to the Python-mode installer path until the next successful release."
          fi

          # Stamp the wheel filename into manifest so setup.sh can find it by name
          _whl_name=$(ls dist/*.whl 2>/dev/null | head -1 | xargs basename 2>/dev/null || echo "")
          printf '{\n  "version": "%s",\n  "ver_number": "%s",\n  "wheel": "%s",\n  "provider": "github-releases"\n}\n' \
            "$TAG" "$VER" "$_whl_name" > cycentra-release/manifest.json

          tar -czf cycentra-release.tar.gz cycentra-release/

      # ── Publish to GitHub Packages (Maven Workaround - No "com.") ────────
      - name: Publish files to GitHub Packages
        if: steps.version.outputs.is_release == 'true'
        run: |
          OWNER="cycentra"
          REPO="Cy360"
          VER=${{ steps.version.outputs.ver }}
          
          # We use "cycentra" as the group path instead of "com/cycentra"
          echo "Uploading compiled setup binary..."
          curl -X PUT -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
               -T cycentra-setup-bin \
               "https://maven.pkg.github.com/$OWNER/$REPO/cycentra/setup/$VER/setup-$VER"

          echo "Uploading release bundle..."
          curl -X PUT -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
               -T cycentra-release.tar.gz \
               "https://maven.pkg.github.com/$OWNER/$REPO/cycentra/bundle/$VER/bundle-$VER.tar.gz"

          echo "Uploading wheel..."
          for wheel in dist/*.whl; do
            curl -X PUT -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                 -T "$wheel" \
                 "https://maven.pkg.github.com/$OWNER/$REPO/cycentra/backend/$VER/$(basename $wheel)"
          done

          # ── Publish 'latest' aliases — overwrite on every release so
          #    servers can always pull without knowing the version number.
          echo "Updating 'latest' aliases..."
          curl -s -X PUT -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
               -T cycentra-setup-bin \
               "https://maven.pkg.github.com/$OWNER/$REPO/cycentra/setup/latest/setup-latest"

          curl -s -X PUT -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
               -T cycentra-release.tar.gz \
               "https://maven.pkg.github.com/$OWNER/$REPO/cycentra/bundle/latest/bundle-latest.tar.gz"

          for wheel in dist/*.whl; do
            # Rename wheel to a stable filename (strip version suffix) for the latest slot.
            stable_name=$(basename "$wheel" | sed "s/-${VER}-/-latest-/")
            curl -s -X PUT -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                 -T "$wheel" \
                 "https://maven.pkg.github.com/$OWNER/$REPO/cycentra/backend/latest/${stable_name}"
          done
          echo "All packages published (versioned + latest)."

      # ── Create GitHub Release ──────────────────────────────────────────
      - name: Create GitHub Release
        if: steps.version.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "CyCentra 360 ${{ steps.version.outputs.tag }}"
          body: |
            ## CyCentra 360 Release ${{ steps.version.outputs.tag }}
            
            ### Installation
            Always pulls the latest version — no version number needed:

            ```bash
            PAT="YOUR_GITHUB_PAT"

            ASSET_URL=$(curl -sf \
              -H "Authorization: token $PAT" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/cycentra/Cy360/releases/latest" \
              | grep -o '"url": *"https://api.github.com/repos/cycentra/Cy360/releases/assets/[0-9]*"' \
              | head -1 | grep -o 'https://[^"]*')

            curl -L \
              -H "Authorization: token $PAT" \
              -H "Accept: application/octet-stream" \
              "$ASSET_URL" \
              -o /tmp/cycentra-release.tar.gz && \
            mkdir -p /tmp/cycentra-install && \
            tar -xzf /tmp/cycentra-release.tar.gz -C /tmp/cycentra-install --strip-components=1 && \
            cd /tmp/cycentra-install && sudo bash cycentra-setup.sh
            ```
          files: |
            cycentra-release.tar.gz
            cycentra-setup.sh
            dist/*.whl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}