name: Build & Publish — CyCentra 360

on:
  push:
    #branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

# Prevents the "5 instances" issue. 
# Only one run per commit (SHA) will execute at a time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Pre-create a draft release so macOS/Windows can upload binaries to it
  # directly as Release assets instead of Actions Artifacts. GitHub Releases
  # storage is a separate quota from Actions Artifacts — the latter got
  # wedged org-wide on 2026-07-18 (a different repo, CyIRIS, accumulated
  # ~41GB of un-expired artifacts and blocked "CreateArtifact" for every repo
  # in the org, Cy360 included, even though Cy360 itself had zero artifacts).
  # Routing the macOS/Windows hand-off through Releases instead removes this
  # whole failure class permanently, not just until the artifact quota clears.
  # Fast ubuntu-latest job — safe to `needs:` without reintroducing the
  # runner-queue hang risk described below (that risk is specific to
  # macos-13/windows-latest runner allocation, not this job).
  create-release-draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      is_release: ${{ steps.version.outputs.is_release }}
    steps:
      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tag=${TAG}"      >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            echo "tag="             >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Create draft release (upload target for EDR binaries)
        if: steps.version.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          gh release view "$TAG" --repo cycentra/Cy360 >/dev/null 2>&1 || \
            gh release create "$TAG" --repo cycentra/Cy360 --draft \
              --title "CyCentra 360 ${TAG} (building...)" \
              --notes "Release in progress — populated by build-and-publish."

  # ── CyEDR agent + system-tray binaries (macOS / Windows) ────────────────────
  # Built here — separate runner OS, so they genuinely need a hand-off into
  # build-and-publish below. That hand-off uploads straight to the draft
  # release above as Release assets (see create-release-draft) — NOT Actions
  # Artifacts, which is what wedged org-wide on 2026-07-18 (see that job's
  # comment). Linux does NOT need this hand-off at all (built inline in
  # build-and-publish). `timeout-minutes` below is a safety net: if these
  # ever get stuck queued (GitHub not allocating a runner — happened for 18h
  # on v1.0.233), build-and-publish is only delayed by the timeout, not
  # blocked indefinitely — Linux still ships every time regardless of these.
  # continue-on-error means a failure here never fails the overall release;
  # cycentra-setup.sh's staging step already tolerates missing platforms.
  build-edr-macos:
    needs: create-release-draft
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-13 was fully retired by GitHub in Dec 2025 — jobs requesting it
          # queue forever ("Waiting for a runner to pick up this job..") since the
          # label no longer maps to any runner. macos-15-intel is GitHub's current
          # label for Intel/x86_64 GitHub-hosted macOS runners.
          - runner: macos-15-intel   # Intel — GitHub-hosted, native (no cross-compile)
            arch: intel64
          # macos-14 deprecation began 2026-07-06, fully unsupported 2026-11-02
          # (brownout failures already possible in this window) — moved to
          # macos-15 (GA, Apple Silicon) ahead of that.
          - runner: macos-15   # Apple Silicon — GitHub-hosted, native
            arch: arm64
    runs-on: ${{ matrix.runner }}
    continue-on-error: true
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build CyEDR agent + tray (macOS ${{ matrix.arch }})
        run: |
          set -e
          mkdir -p out
          python -m pip install --upgrade pip -q
          pip install -q pyinstaller requests psutil paramiko cryptography bcrypt pywinrm xmltodict watchdog
          pyinstaller --onefile --windowed --name cyedr-agent \
            --hidden-import bcrypt --hidden-import paramiko agent/cyedr_agent.py
          cp dist/cyedr-agent "out/cyedr-agent-macos-${{ matrix.arch }}"
          rm -rf build dist

          # rumps is the macOS menu-bar backend cyedr_tray.py uses (run_rumps);
          # launched directly as a raw binary (not a .app bundle) via the
          # LaunchAgent this repo installs, it does not show a Dock icon.
          pip install -q rumps Pillow
          pyinstaller --onefile --windowed --name cyedr-tray agent/cyedr_tray.py
          cp dist/cyedr-tray "out/cyedr-tray-macos-${{ matrix.arch }}"
          chmod +x out/*
      - name: Publish binaries to release assets (bypasses Actions artifact storage quota)
        if: needs.create-release-draft.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(out/*)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::warning::No binaries found in out/ — skipping release asset upload"
          else
            gh release upload "${{ needs.create-release-draft.outputs.tag }}" "${files[@]}" \
              --repo cycentra/Cy360 --clobber
          fi

  build-edr-windows:
    needs: create-release-draft
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build CyEDR agent + tray (Windows x64)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip -q
          pip install -q pyinstaller requests psutil paramiko cryptography bcrypt pywinrm xmltodict watchdog pywin32
          New-Item -ItemType Directory -Force -Path out | Out-Null
          pyinstaller --onefile --noconsole --name cyedr-agent `
            --hidden-import win32evtlog --hidden-import win32evtlogutil --hidden-import win32con `
            --hidden-import win32pipe --hidden-import win32file --hidden-import pywintypes `
            --hidden-import bcrypt agent/cyedr_agent.py
          Copy-Item dist/cyedr-agent.exe out/cyedr-agent-windows-x64.exe
          Remove-Item -Recurse -Force build, dist

          pip install -q pystray Pillow
          pyinstaller --onefile --noconsole --name cyedr-tray `
            --hidden-import win32pipe --hidden-import win32file --hidden-import pywintypes `
            agent/cyedr_tray.py
          Copy-Item dist/cyedr-tray.exe out/cyedr-tray-windows-x64.exe
      - name: Publish binaries to release assets (bypasses Actions artifact storage quota)
        if: needs.create-release-draft.outputs.is_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(out/*)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::warning::No binaries found in out/ — skipping release asset upload"
          else
            gh release upload "${{ needs.create-release-draft.outputs.tag }}" "${files[@]}" \
              --repo cycentra/Cy360 --clobber
          fi

  build-and-publish:
    # Deliberately NOT `needs: [build-edr-macos, build-edr-windows]`.
    # timeout-minutes on those jobs only bounds their EXECUTION time — a job
    # stuck in GitHub's own "queued" state (no runner allocated yet) never
    # starts the timeout clock at all. That's exactly how v1.0.233's release
    # hung for 18 hours (macos-13 queued, never scheduled, needs: waited
    # forever). Linux EDR binaries are built inline below (same job, no
    # cross-job hand-off at all) so the release never depends on macOS/Windows
    # completing at all. The release-asset download step further down is
    # best-effort (continue-on-error, tolerates zero files found): if
    # macOS/Windows happen to finish before this job reaches that step,
    # their binaries get bundled too; if not, this release just ships
    # without them and the next one picks them up — never blocks either way.
    # (Also deliberately not `needs: create-release-draft` for the same
    # reason — this job resolves its own version/tag independently below and
    # doesn't require that job to have finished first.)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: write

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tag=${TAG}"       >> $GITHUB_OUTPUT
            echo "ver=${TAG#v}"     >> $GITHUB_OUTPUT
            echo "is_release=true"  >> $GITHUB_OUTPUT
          else
            echo "tag=dev-${{ github.run_number }}" >> $GITHUB_OUTPUT
            echo "ver=0.0.${{ github.run_number }}"  >> $GITHUB_OUTPUT
            echo "is_release=false"                   >> $GITHUB_OUTPUT
          fi

      # ── Build React SPA ─────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build React SPA
        run: cd portal && npm ci && npm run build

      # ── Build Python wheel ───────────────────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Stamp version into pyproject.toml
        run: |
          VER=${{ steps.version.outputs.ver }}
          sed -i "s/^version = .*/version = \"${VER}\"/" backend/pyproject.toml

      - name: Install build tool
        run: pip install build==1.2.1 -q

      - name: Build cycentra-backend wheel
        run: |
          cd backend
          python -m build --wheel --outdir ../dist/

      # ── Compile setup script ─────────────────────────────────────────────
      - name: Install SHC and compile setup script to Linux binary
        run: |
          sudo apt-get install -y shc
          # Compile cycentra-setup.sh → Linux x86_64 binary
          shc -r -f cycentra-setup.sh -o cycentra-setup-bin 2>&1
          strip cycentra-setup-bin 2>/dev/null || true
          chmod +x cycentra-setup-bin
          echo "SHC binary size: $(du -sh cycentra-setup-bin | cut -f1)"
          # NOTE: cycentra-setup.sh (plain script) is kept as-is for the GitHub Release
          # asset — the update mechanism downloads it and the OS reads the #!/bin/bash
          # shebang when the backend executes it directly (no 'bash' prefix needed).
          # The SHC binary (cycentra-setup-bin) is included only in the bundle tarball.

      # ── CyEDR agent + tray binaries (Linux) ──────────────────────────────
      # Built directly in this job — not a separate job + artifact upload —
      # so Linux binaries ship every release regardless of Actions artifact
      # storage quota state (see build-edr-macos's comment above for why
      # that quota matters here). docker/setup-qemu-action is needed for the
      # aarch64 cross-build; ubuntu-latest already has Docker + amd64 native.
      - uses: docker/setup-qemu-action@v3

      - name: Build CyEDR agent + tray (Linux x86_64, aarch64)
        run: |
          mkdir -p edr-bin
          sudo SKIP_WIN=1 SKIP_DEB_RPM=1 \
            DEST_DIR="$(pwd)/edr-bin" \
            AGENT_SRC="$(pwd)/agent/cyedr_agent.py" \
            TRAY_SRC="$(pwd)/agent/cyedr_tray.py" \
            bash agent-packages/build-edr-packages.sh 0.0.0 || true
          # build-edr-packages.sh exits 1 on the expected macOS-stub warnings
          # (this only builds Linux) — verify the binaries actually needed
          # are present rather than trusting the script's exit code, but
          # never fail the release over it (warn + continue, same tolerance
          # as the macOS/Windows download step below).
          for f in cyedr-agent-linux-x86_64 cyedr-agent-linux-aarch64 \
                   cyedr-tray-linux-x86_64 cyedr-tray-linux-aarch64; do
            [[ -f "edr-bin/$f" ]] && echo "OK: $f" || echo "::warning::Linux EDR binary missing: $f"
          done

      - name: Download CyEDR agent + tray binaries (macOS / Windows) from release assets
        # Pulled from the draft release's Release assets (see create-release-draft),
        # not Actions Artifacts — sidesteps the Actions artifact storage quota
        # entirely. Best-effort: if macOS/Windows haven't uploaded yet, or their
        # job failed/never got a runner, this release just ships without them and
        # the next one picks them up — never blocks the Linux release.
        if: steps.version.outputs.is_release == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p edr-bin
          gh release download "${{ steps.version.outputs.tag }}" \
            --repo cycentra/Cy360 --dir edr-bin \
            --pattern 'cyedr-agent-macos-*' \
            --pattern 'cyedr-tray-macos-*' \
            --pattern 'cyedr-agent-windows-x64.exe' \
            --pattern 'cyedr-tray-windows-x64.exe' \
            --clobber \
            || echo "::warning::No macOS/Windows EDR release assets available yet"

      - name: Build customer release bundle
        run: |
          TAG=${{ steps.version.outputs.tag }}
          VER=${{ steps.version.outputs.ver }}
          
          mkdir -p cycentra-release/portal
          cp -r portal/dist/ cycentra-release/portal/dist/
          # Ship both the compiled binary and the plain .sh source.
          # The .sh is used by setup.sh's self-update path: when a server runs
          # --update from /opt/cycentra/cycentra-setup.sh the self-copy no-ops
          # ($0 == dest), but the bundle-preference branch copies cycentra-setup.sh
          # from $BUNDLE_DIR on the very first run — fixing stale installs.
          cp cycentra-setup-bin cycentra-release/cycentra-setup
          cp cycentra-setup.sh  cycentra-release/cycentra-setup.sh
          chmod +x cycentra-release/cycentra-setup
          cp docs/RELEASE_NOTES.md cycentra-release/
          echo "${TAG}" > cycentra-release/VERSION

          # Include wheel in bundle so local installs don't need a separate download
          cp dist/*.whl cycentra-release/ 2>/dev/null || true

          # Include Wazuh config assets (rules, decoders, ossec.conf, agent.conf, integrations)
          [[ -d CYSIEM-Config ]] && cp -r CYSIEM-Config cycentra-release/CYSIEM-Config || true

          # Include OOB RBAC default (local cyadmin account)
          [[ -f backend/rbac.default.json ]] && cp backend/rbac.default.json cycentra-release/rbac.default.json || true

          # Include CyEDR agent source + installer scripts so setup.sh can stage them
          # to /var/lib/cycentra-agent-packages/edr/ on every install/update run.
          mkdir -p cycentra-release/agent
          cp agent/cyedr_agent.py cycentra-release/agent/
          cp agent/cyedr_tray.py  cycentra-release/agent/
          mkdir -p cycentra-release/scripts
          cp scripts/cyedr-install.sh  cycentra-release/scripts/
          cp scripts/cyedr-install.ps1 cycentra-release/scripts/

          # Include agent packages so servers never depend on packages.wazuh.com being reachable.
          # setup.sh copies these to /var/lib/cycentra-agent-packages/ during install/update.
          if [[ -d agent-packages ]]; then
            mkdir -p cycentra-release/agent-packages
            cp agent-packages/cy360-agent-* cycentra-release/agent-packages/ 2>/dev/null || true
            echo "Agent packages bundled: $(ls cycentra-release/agent-packages/ | wc -l | tr -d ' ') files"
          fi

          # Include the CyEDR agent + tray binaries: Linux built inline above,
          # macOS/Windows downloaded from build-edr-macos/build-edr-windows —
          # both land in edr-bin/. setup.sh stages these into
          # /var/lib/cycentra-agent-packages/edr/ automatically — this is what makes the
          # portal's install-link/copy-paste flow work with no manual build step for
          # customers or for devops on every release.
          if [[ -d edr-bin ]] && [[ -n "$(ls -A edr-bin 2>/dev/null)" ]]; then
            mkdir -p cycentra-release/agent-packages/edr
            cp edr-bin/* cycentra-release/agent-packages/edr/ 2>/dev/null || true
            echo "CyEDR binaries bundled: $(ls cycentra-release/agent-packages/edr/ | wc -l | tr -d ' ') files"
          else
            echo "::warning::No CyEDR agent/tray binaries downloaded — one or more build-edr-* jobs failed. Endpoints will fall back to the Python-mode installer path until the next successful release."
          fi

          # Stamp the wheel filename into manifest so setup.sh can find it by name
          _whl_name=$(ls dist/*.whl 2>/dev/null | head -1 | xargs basename 2>/dev/null || echo "")
          printf '{\n  "version": "%s",\n  "ver_number": "%s",\n  "wheel": "%s",\n  "provider": "github-releases"\n}\n' \
            "$TAG" "$VER" "$_whl_name" > cycentra-release/manifest.json

          tar -czf cycentra-release.tar.gz cycentra-release/

      # ── Publish to GitHub Packages (Maven Workaround - No "com.") ────────
      - name: Publish files to GitHub Packages
        if: steps.version.outputs.is_release == 'true'
        run: |
          OWNER="cycentra"
          REPO="Cy360"
          VER=${{ steps.version.outputs.ver }}
          
          # We use "cycentra" as the group path instead of "com/cycentra"
          echo "Uploading compiled setup binary..."
          curl -X PUT -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
               -T cycentra-setup-bin \
               "https://maven.pkg.github.com/$OWNER/$REPO/cycentra/setup/$VER/setup-$VER"

          echo "Uploading release bundle..."
          curl -X PUT -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
               -T cycentra-release.tar.gz \
               "https://maven.pkg.github.com/$OWNER/$REPO/cycentra/bundle/$VER/bundle-$VER.tar.gz"

          echo "Uploading wheel..."
          for wheel in dist/*.whl; do
            curl -X PUT -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                 -T "$wheel" \
                 "https://maven.pkg.github.com/$OWNER/$REPO/cycentra/backend/$VER/$(basename $wheel)"
          done

          # ── Publish 'latest' aliases — overwrite on every release so
          #    servers can always pull without knowing the version number.
          echo "Updating 'latest' aliases..."
          curl -s -X PUT -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
               -T cycentra-setup-bin \
               "https://maven.pkg.github.com/$OWNER/$REPO/cycentra/setup/latest/setup-latest"

          curl -s -X PUT -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
               -T cycentra-release.tar.gz \
               "https://maven.pkg.github.com/$OWNER/$REPO/cycentra/bundle/latest/bundle-latest.tar.gz"

          for wheel in dist/*.whl; do
            # Rename wheel to a stable filename (strip version suffix) for the latest slot.
            stable_name=$(basename "$wheel" | sed "s/-${VER}-/-latest-/")
            curl -s -X PUT -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                 -T "$wheel" \
                 "https://maven.pkg.github.com/$OWNER/$REPO/cycentra/backend/latest/${stable_name}"
          done
          echo "All packages published (versioned + latest)."

      # ── Create GitHub Release ──────────────────────────────────────────
      - name: Create GitHub Release
        if: steps.version.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "CyCentra 360 ${{ steps.version.outputs.tag }}"
          # Explicit false — create-release-draft above creates this release as a
          # draft so macOS/Windows have somewhere to upload assets early. This step
          # must un-draft it on every run, or the release (and its assets) never
          # becomes visible to customers.
          draft: false
          body: |
            ## CyCentra 360 Release ${{ steps.version.outputs.tag }}
            
            ### Installation
            Always pulls the latest version — no version number needed:

            ```bash
            PAT="YOUR_GITHUB_PAT"

            ASSET_URL=$(curl -sf \
              -H "Authorization: token $PAT" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/cycentra/Cy360/releases/latest" \
              | grep -o '"url": *"https://api.github.com/repos/cycentra/Cy360/releases/assets/[0-9]*"' \
              | head -1 | grep -o 'https://[^"]*')

            curl -L \
              -H "Authorization: token $PAT" \
              -H "Accept: application/octet-stream" \
              "$ASSET_URL" \
              -o /tmp/cycentra-release.tar.gz && \
            mkdir -p /tmp/cycentra-install && \
            tar -xzf /tmp/cycentra-release.tar.gz -C /tmp/cycentra-install --strip-components=1 && \
            cd /tmp/cycentra-install && sudo bash cycentra-setup.sh
            ```
          files: |
            cycentra-release.tar.gz
            cycentra-setup.sh
            dist/*.whl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}