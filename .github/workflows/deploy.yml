name: Build & Publish — CyCentra 360

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:

  build-portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build React SPA
        run: cd portal && npm ci && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: portal-dist
          path: portal/dist/
          retention-days: 1

  build-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VER="${TAG#v}"
          else
            VER="0.0.${{ github.run_number }}"
          fi
          echo "ver=${VER}" >> $GITHUB_OUTPUT

      - name: Stamp version into pyproject.toml
        run: |
          VER=${{ steps.version.outputs.ver }}
          sed -i "s/^version = .*/version = \"${VER}\"/" backend/pyproject.toml

      - name: Install build tool
        run: pip install build==1.2.1 -q

      - name: Build cycentra-backend wheel
        run: |
          cd backend
          python -m build --wheel --outdir ../dist/

      - uses: actions/upload-artifact@v4
        with:
          name: python-wheel
          path: dist/*.whl
          retention-days: 1

  publish:
    needs: [build-portal, build-wheel]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write  # Critical for pushing to GitHub Packages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: portal-dist
          path: portal/dist/

      - uses: actions/download-artifact@v4
        with:
          name: python-wheel
          path: dist/

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tag=${TAG}"      >> $GITHUB_OUTPUT
            echo "ver=${TAG#v}"    >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            echo "tag=dev-${{ github.run_number }}" >> $GITHUB_OUTPUT
            echo "ver=0.0.${{ github.run_number }}"  >> $GITHUB_OUTPUT
            echo "is_release=false"                  >> $GITHUB_OUTPUT
          fi

      - name: Build customer release bundle
        run: |
          TAG=${{ steps.version.outputs.tag }}
          VER=${{ steps.version.outputs.ver }}
          
          mkdir -p cycentra-release/portal
          cp -r portal/dist/ cycentra-release/portal/dist/
          
          # Copy migrations and configs if they exist
          cp -r backend/cysiemstack/postgres/init.sql cycentra-release/db/ 2>/dev/null || true
          cp cycentra-setup.sh cycentra-release/
          echo "${TAG}" > cycentra-release/VERSION

          # Updated manifest to reflect GitHub storage
          printf '{\n  "version": "%s",\n  "ver_number": "%s",\n  "provider": "github-packages"\n}\n' \
            "$TAG" "$VER" > cycentra-release/manifest.json

          tar -czf cycentra-release.tar.gz cycentra-release/

      # ── Publish to GitHub Packages (Maven Registry Workaround) ──────────
      - name: Publish files to GitHub Packages
        if: steps.version.outputs.is_release == 'true'
        run: |
          OWNER="cycentra"
          REPO="cycentra360"
          VER=${{ steps.version.outputs.ver }}
          
          echo "Uploading setup script to GitHub Packages..."
          curl -X PUT -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
               -T cycentra-setup.sh \
               "https://maven.pkg.github.com/$OWNER/$REPO/com/cycentra/setup/$VER/setup-$VER.sh"

          echo "Uploading release bundle to GitHub Packages..."
          curl -X PUT -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
               -T cycentra-release.tar.gz \
               "https://maven.pkg.github.com/$OWNER/$REPO/com/cycentra/bundle/$VER/bundle-$VER.tar.gz"

          echo "Uploading wheel to GitHub Packages..."
          for wheel in dist/*.whl; do
            curl -X PUT -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                 -T "$wheel" \
                 "https://maven.pkg.github.com/$OWNER/$REPO/com/cycentra/backend/$VER/$(basename $wheel)"
          done

      # ── Create GitHub Release (Standard UI) ────────────────────────────────
      - name: Create GitHub Release
        if: steps.version.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "CyCentra 360 ${{ steps.version.outputs.tag }}"
          body: |
            ## CyCentra 360 Release ${{ steps.version.outputs.tag }}
            
            ### Installation
            Use your GitHub Personal Access Token (PAT) to download:
            
            ```bash
            curl -L -H "Authorization: Bearer YOUR_TOKEN" \
                 -o cycentra-setup.sh \
                 "[https://maven.pkg.github.com/cycentra/cycentra360/com/cycentra/setup/$](https://maven.pkg.github.com/cycentra/cycentra360/com/cycentra/setup/$){{ steps.version.outputs.ver }}/setup-${{ steps.version.outputs.ver }}.sh"
            ```
          files: |
            cycentra-release.tar.gz
            cycentra-setup.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}