<svg width="100%" height="100%" viewBox="0 0 1600 600"
     xmlns="http://www.w3.org/2000/svg"
     preserveAspectRatio="xMidYMid meet">

  <defs>
    <!-- Robotic tech blue gradient -->
    <linearGradient id="robotBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B1F3A"/>
      <stop offset="50%" stop-color="#1E40FF"/>
      <stop offset="100%" stop-color="#4FB6FF"/>
    </linearGradient>
  </defs>

  <style>
    .brand {
      font-family: "Orbitron", "Eurostile", "Bank Gothic", Arial, sans-serif;
      font-weight: 800;
      letter-spacing: 0.20em; /* reduced for CY clarity */
      fill: url(#robotBlue);
    }
    .tagline {
      font-family: "Orbitron", Arial, sans-serif;
      font-weight: 400;
      letter-spacing: 0.32em;
      fill: #6CB6FF;
    }
  </style>

  <!-- Brand Name -->
  <text
    x="800"
    y="290"
    text-anchor="middle"
    dominant-baseline="middle"
    class="brand"
    font-size="190">
    CYCENTRA
  </text>

  <!-- Precision divider -->
  <rect x="260" y="360" width="1080" height="4"
        fill="#6CB6FF" opacity="0.35"/>

  <!-- Tagline -->
  <text
    x="800"
    y="440"
    text-anchor="middle"
    class="tagline"
    font-size="36">
    FROM SIGNALS TO STRENGTH
  </text>

</svg>
